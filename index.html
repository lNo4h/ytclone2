<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="cabecalho">

        <div class="cabecalho-inicio">
            <i class="fa-solid fa-bars"></i>

            <div class="logotipo">

                <i class="fa-brands fa-youtube logotipo-icone"></i>

                <p class="logotipo-nome">YouTube</p>
                <p class="logotipo-pais">BR</p>
            </div>



        </div>


        <div class="cabecalho-centro">
            <div class="search">

                <input type="text" name="search" class="search-input" id="busca" placeholder="   Pesquisar..">
                <button class="search-button">
                    <i class="fa-solid fa-magnifying-glass"> </i>
                </button>
            </div>
            <button class="microphone" title="microphone">
                <i class="fa-solid fa-microphone"></i>
            </button>
        </div>


        <div class="cabecalho-final">

            <button class="logotipo-video" title="Criar">
                <i class="fa-solid fa-video"></i>
            </button>
            <button class="logotipo-notificacoes" title="Notificações">
                <i class="fa-solid fa-bell"></i>


            </button>
            <button class="logotipo-conta" title="Sua conta">V</button>

        </div>

    </header>
    <main class="principal">
        <div class="principal-sidebar">
            <div class="sidebar-inicio">
                <a>
                    <a class="sidebar-button">
                        <i class="fa-solid fa-house"></i>
                        <span>Início</span>
                    </a>
                </a>
                <a>
                    <a class="sidebar-button">
                        <i class="fa-solid fa-clapperboard"></i>
                        <span>Shorts</span>
                    </a>
                </a>
                <a>
                    <a class="sidebar-button">
                    <i class="fa-solid fa-square-rss"></i>
                    <span>Inscrições</span>
                </a>
            </a>

            </div>
            <div class="sidebar-centro">
                <span class="sidebar-titulo">Você</span>

                <a>
                    <a class="sidebar-button">
                    <i class="fa-solid fa-user"></i>
                    <span>Seu Canal</span>
                </a>
            </a>
                <a>
                    <a class="sidebar-button">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <span>Historico</span>
                </a>
            </a>
                <a>
                    <a class="sidebar-button">
                    <i class="fa-solid fa-list"></i>
                    <span>Playlist</span>
                </a>
            </a>
                <a>
                    <a class="sidebar-button">
                    <i class="fa-solid fa-video"></i>
                    <span>Seus Vídeos</span>
                </a>
            </a>
                <a>
                    <a class="sidebar-button">
                    <i class="fa-solid fa-clock"></i>
                    <span>Assistir mais tarde</span>
                </a>
            </a>
                <a>
                    <a class="sidebar-button">
                    <i class="fa-solid fa-thumbs-up"></i>
                    <span>Vídeos curtidos</span>
                </a>
            </a>
            </div>
            <div class="sidebar-final">
                <span class="sidebar-titulo">Explorar</span>

                <a>
                    <a class="sidebar-button">
                    <i class="fa-solid fa-fire"></i>
                    <span>Em alta</span>
                </a>
            </a>
                <a>
                    <a class="sidebar-button">
                    <i class="fa-solid fa-music"></i>
                    <span>Musica</span>
                </a>
            </a>
                <a>
                    <a class="sidebar-button">
                    <i class="fa-solid fa-film"></i>
                    <span>Filmes</span>
                </a>
            </a>
                <a>
                    <a class="sidebar-button">
                    <i class="fa-solid fa-tower-broadcast"></i>
                    <span>Ao vivo</span>
                </a>
            </a>
                <a>
                    <a class="sidebar-button">
                    <i class="fa-solid fa-gamepad"></i>
                    <span>Jogos</span>
                </a>
            </a>
                <a>
                    <a class="sidebar-button">
                    <i class="fa-solid fa-newspaper"></i>
                    <span>Notícias</span>
                </a>
            </a>

            <a>
                <a class="sidebar-button">
                <i class="fa-solid fa-trophy"></i>
                <span>Esportes</span>
            </a>
        </a>


            </div>


        </div>
        <div class="principal-video">a</div>
        <div class="principal-recomendados">a</div>
    </main>






    <script src="script.js"></script>
</body>

</html>
