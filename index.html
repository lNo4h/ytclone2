<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="cabecalho">

        <div class="cabecalho-inicio">
            <i class="fa-solid fa-bars"></i>

            <div class="logotipo">

                <i class="fa-brands fa-youtube logotipo-icone"></i>

                <p class="logotipo-nome">YouTube</p>
                <p class="logotipo-pais">BR</p>
            </div>



        </div>


        <div class="cabecalho-centro">
            <div class="search">
                <input type="text" name="search" class="search-input">
                <button class="search-button">
                    <i class="fa-solid fa-magnifying-glass"> </i>
                </button>
            </div>
            <button class="microphone" title="microphone">
                <i class="fa-solid fa-microphone"></i>
            </button>
        </div>


        <div class="cabecalho-final">

            <button class="logotipo-video" title="Criar">
                <i class="fa-solid fa-video"></i>
            </button>
            <button class="logotipo-notificacoes" title="Notificações">
                <i class="fa-solid fa-bell"></i>


            </button>
            <button class="logotipo-conta" title="Sua conta">V</button>

        </div>

    </header>







    <script src="script.js"></script>
</body>

</html>
